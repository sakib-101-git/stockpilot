services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: stockpilot
      POSTGRES_DB: stockpilot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stockpilot_app:stockpilot_app@db:5432/stockpilot
      MIGRATION_DATABASE_URL: postgresql+asyncpg://stockpilot:stockpilot@db:5432/stockpilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8000"
    volumes:
      - uploads:/tmp/stockpilot-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://stockpilot_app:stockpilot_app@db:5432/stockpilot
      MIGRATION_DATABASE_URL: postgresql+asyncpg://stockpilot:stockpilot@db:5432/stockpilot
      REDIS_URL: redis://redis:6379/0
    ports:
      - "9101:9101"
    volumes:
      - uploads:/tmp/stockpilot-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: stockpilot
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  uploads:
  prometheus_data:
  grafana_data: